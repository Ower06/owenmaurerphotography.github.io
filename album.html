<!doctype html>
<html lang="en-US">
    <head>
        <title>Photo Gallery | Owen Maurer Photography</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <meta name="author" content="Owen Maurer" />
        <meta name="description" content="Album of Photos Taken by Owen Maurer" />
        <link rel="icon" href="photos/permanent/mini logo.png" type="image/x-icon" />
        <link href="styles/style.css" rel="stylesheet" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <div id="page-wrapper">
        <body>
            <header>
                <img class="logo" src="photos/permanent/flower logo.jpg" alt="Logo of a flower" width = 64px height = 64px/>
                <p class="page-title"><a href="index.html">Owen Maurer Photography</a></p>
                <nav>
                    <a href="gallery.html">Gallery</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Get in Touch</a>
                    <a href="prints.html">Prints</a>
                </nav>
            </header>
            <hr>

            <a href="gallery.html" id="album-exit" class="underline-link">&#10094; back to gallery</a>
            <div id="album-page-header">
                <div id="album-title"></div>
                <div id="album-date"></div>
            </div>

            <div id="photo-grid" class="photo-grid"></div>
            <div id="overlay" class="overlay">
                <img id="overlay-img" src="" />
                <button id="photo-arrow-prev" class="photo-arrow" onclick="changePhoto(-1)">&#10094;</button>
                <button id="photo-arrow-next" class="photo-arrow" onclick="changePhoto(1)">&#10095;</button>
                <button class="exit" onclick="exit()">&#10006;</button>
            </div>
            <script>
                const params = new URLSearchParams(window.location.search);
                const albumSlug = params.get("album");

                async function loadAlbumInfo() {
                    const ALBUM_JSON = "photos/albums.json";
                    const res = await fetch(ALBUM_JSON);
                    const data = await res.json();
                    const album = data.find(album => album.slug === albumSlug);
                    document.getElementById("album-title").textContent = album.name;
                    document.getElementById("album-date").textContent = album.date;
                }

                const PHOTOS_JSON = "photos/" + albumSlug + "/photos.json"
                let photos = [];
                let currentIndex = 0;
                

                async function loadPhotos() {
                    const photoRes = await fetch(PHOTOS_JSON);
                    const photoData = await photoRes.json();
                    const container = document.getElementById("photo-grid");

                    photoData.forEach((photo, i) => {
                        const currPhoto = document.createElement("div");
                        currPhoto.className = "photo";

                        const img = document.createElement("img");
                        img.src = photo.src;
                        img.addEventListener("click", () => {
                            setScale(1);
                            document.getElementById("overlay").classList.add("active");
                            document.getElementById("overlay-img").src = img.src;
                            currentIndex = i;
                            updateArrows();
                        })

                        currPhoto.appendChild(img);
                        container.appendChild(currPhoto);
                        photos.push(currPhoto);
                    })
                }

                document.getElementById("overlay").addEventListener("click", (event) => {
                    if (event.target === event.currentTarget) {
                        exit();
                    }
                });

                async function changePhoto(direction) {
                    setScale(1);
                    if (direction > 0 && currentIndex < photos.length - 1) {
                        document.getElementById("overlay-img").src = photos[currentIndex + 1].querySelector("img").src;
                        currentIndex += 1;
                    } else if (direction < 0 && currentIndex > 0) {
                        document.getElementById("overlay-img").src = photos[currentIndex - 1].querySelector("img").src;
                        currentIndex -= 1;
                    }
                    updateArrows();
                }

                async function exit() {
                    document.getElementById("overlay").classList.remove("active");
                    setScale(1);
                }

                async function updateArrows() {
                    if (currentIndex === 0) {
                        document.getElementById("photo-arrow-prev").classList.add("hidden");
                    } else {
                        document.getElementById("photo-arrow-prev").classList.remove("hidden");
                    }

                    if (currentIndex === photos.length - 1) {
                        document.getElementById("photo-arrow-next").classList.add("hidden");
                    } else {
                        document.getElementById("photo-arrow-next").classList.remove("hidden");
                    }

                }

                // ZOOM CONTROLS FOR INDIVIDUAL IMAGES

                const overlayE1 = document.getElementById("overlay");
                const overlayImg = document.getElementById("overlay-img");

                let scale = 1;
                let panX = 0;
                let panY = 0;
                const MIN_SCALE = 1;
                const MAX_SCALE = 5;

                function applyTransform() {
                    overlayImg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
                }
                
                function setScale(newScale) {
                    scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
                    if (scale === 1) { panX = 0; panY = 0; }
                    applyTransform();
                }

                overlayE1.addEventListener("wheel", (event) => {
                    event.preventDefault();
                    setScale(scale * (event.deltaY < 0 ? 1.1 : 0.9));
                }, { passive: false });

                let startDistance = 0;
                let startScale = 1;
                let pinching = false;

                function touchDistance(touches) {
                    return Math.hypot(
                        touches[0].clientX - touches[1].clientX,
                        touches[0].clientY - touches[1].clientY,
                    );
                }

                overlayE1.addEventListener("touchstart", (event) => {
                    if (event.touches.length === 2) {
                        pinching = true;
                        startDistance = touchDistance(event.touches);
                        startScale = scale;
                    }
                });

                overlayE1.addEventListener("touchmove", (event) => {
                    if (event.touches.length === 2) {
                        event.preventDefault();
                        setScale(startScale * touchDistance(event.touches) / startDistance);
                    }
                }, { passive: false });

                overlayE1.addEventListener("touchend", (event) => {
                    if (event.touches.length < 2) {
                        pinching = false;
                        dragging = false;
                    }
                });

                //  PANNING CONTROLS FOR INDIVIDUAL IMAGES

                let dragging = false;
                let lastX = 0;
                let lastY = 0;

                overlayImg.addEventListener("pointerdown", (event) => {
                    if (scale > 1) {
                        dragging = true;
                        lastX = event.clientX;
                        lastY = event.clientY;
                    }
                });

                overlayImg.addEventListener("pointermove", (event) => {
                    if (!dragging || pinching) return;
                    panX += event.clientX - lastX;
                    panY += event.clientY - lastY;
                    lastX = event.clientX;
                    lastY = event.clientY;
                    applyTransform();
                })

                window.addEventListener("pointerup", () => {dragging = false; });

                loadAlbumInfo();
                loadPhotos();
            </script>
            <hr>
        </body>
    </div>
</html>

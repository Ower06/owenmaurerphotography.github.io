<!doctype html>
<html lang="en-US">
    <head>
        <title>Owen Maurer Photography</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <meta name="author" content="Owen Maurer" />
        <meta name="description" content="A page to view Owen Maurer's photography" />
        <link rel="icon" href="photos/permanent/mini logo.png" type="image/x-icon" />
        <link href="styles/style.css" rel="stylesheet" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <script src="scripts/main.js" defer></script>
    </head>
    <div id="page-wrapper">
        <body>
            <header>
                <img class="logo" src="photos/permanent/flower logo.jpg" alt="Logo of a flower"/>
                <p class="page-title"><a href="index.html">Owen Maurer Photography</a></p>
                <nav>
                    <a href="gallery.html">Gallery</a>
                    <a href="about-me.html">About Me</a>
                    <a href="contact.html">Get in Touch</a>
                    <a href="prints.html">Prints</a>
                </nav>
            </header>
            
            <hr> 
            <h1>Featured Photos:</h1>
            <div id="carousel" class="carousel">
                <button class="arrow prev" onclick="changeSlide(-1)">&#10094;</button>
                <button class="arrow next" onclick="changeSlide(1)">&#10095;</button>
            </div>
            <script>
                const CAROUSEL_JSON = "photos/featured/featured.json";
                const SLIDE_DURATION_MS = 10000;

                let slides = [];
                let currentIndex = 0;
                let timer = null;

                async function loadCarousel() {
                    const res = await fetch(CAROUSEL_JSON);
                    const data = await res.json();

                    const container = document.getElementById("carousel");

                    data.forEach((item, i) => {
                        const slideEl = document.createElement("div");
                        slideEl.className = "slide" + (i === 0 ? " active" : "");

                        const img = document.createElement("img");
                        img.src = item.src;
                        img.alt = item.caption || "";

                        slideEl.appendChild(img);
                        container.appendChild(slideEl);
                        slides.push(slideEl);
                    });

                    startAutoplay();
                }

                function showSlide(direction) {
                    const oldIndex = currentIndex;

                    if (direction > 0) {
                        currentIndex = (currentIndex + 1) % slides.length;
                    } else {
                        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
                    }
                    slides[oldIndex].classList.add(direction > 0 ? "exit-left" : "exit-right");

                    slides[currentIndex].classList.remove("active", "exit-left", "exit-right");

                    slides[currentIndex].style.transition = "none";
                    slides[currentIndex].style.transform = direction > 0 ? "translateX(100%)" : "translateX(-100%)";
                    slides[currentIndex].offsetHeight;
                    slides[currentIndex].style.transition = "";
                    slides[currentIndex].style.transform = "";
                    slides[currentIndex].classList.add("active");
                    
                }

                function changeSlide(direction) {
                    showSlide(direction);
                    restartAutoplay();
                }

                function startAutoplay() {
                    timer = setInterval(() => showSlide(1), SLIDE_DURATION_MS);
                }

                function restartAutoplay() {
                    clearInterval(timer);
                    startAutoplay();
                }

                loadCarousel();
            </script>
            
            <hr>

            <div class="section-title" >
                <h2>Albums:</h2>
                <a class="underline-link" style="font-size: 2rem; display: flex; margin-left: auto" href="gallery.html">See all</a>
            </div>
            <div id="album-grid" class="album-grid"></div>
            <script>
                const ALBUM_JSON = "photos/albums.json"

                let albums = [];

                async function loadAlbums() {
                    const res = await fetch(ALBUM_JSON);
                    const data = await res.json();
                    const container = document.getElementById("album-grid");

                    for (let i = 0; i < 6; i++) {
                        const album = data[i];
                        const currAlbum = document.createElement("a");
                        currAlbum.className = "album";
                        currAlbum.href = "album.html?album=" + album.slug;

                        const img = document.createElement("img");
                        img.src = album.thumbnailSrc;

                        const albumName = document.createElement("div");
                        albumName.className = "album-name";
                        albumName.textContent = album.name;

                        const albumDate = document.createElement("div");
                        albumDate.className = "album-date";
                        albumDate.textContent = album.date;

                        const caption = document.createElement("div");
                        caption.className = "album-caption"
                        caption.appendChild(albumName);
                        caption.appendChild(albumDate);

                        
                        currAlbum.appendChild(img);
                        currAlbum.appendChild(caption);
                        container.appendChild(currAlbum);
                        albums.push(currAlbum);
                    }

                }

                loadAlbums();
            </script>
        </body>
    </div>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Homepage Carousel Example</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #111;
    color: #eee;
  }

  /* The carousel container: fixed height, everything inside is stacked */
  .carousel {
    position: relative;
    width: 100%;
    height: 70vh;
    overflow: hidden;
  }

  /* Each slide sits on top of the others, invisible by default */
  .slide {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
  }

  .slide.active {
    opacity: 1;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* crops to fill without distorting */
  }

  .caption {
    position: absolute;
    bottom: 24px;
    left: 24px;
    background: rgba(0,0,0,0.5);
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 1rem;
  }

  /* Optional manual arrows */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.4);
    color: white;
    border: none;
    font-size: 2rem;
    padding: 8px 16px;
    cursor: pointer;
    z-index: 10;
  }
  .arrow.prev { left: 12px; }
  .arrow.next { right: 12px; }
</style>
</head>
<body>

<div id="carousel" class="carousel">
  <button class="arrow prev" onclick="changeSlide(-1)">&#10094;</button>
  <button class="arrow next" onclick="changeSlide(1)">&#10095;</button>
</div>

<script>
  const CAROUSEL_JSON = "photos/featured/featured.json";
  const SLIDE_DURATION_MS = 5000; // how long each photo stays up

  let slides = [];
  let currentIndex = 0;
  let timer = null;

  async function loadCarousel() {
    const res = await fetch(CAROUSEL_JSON);
    const data = await res.json();

    const container = document.getElementById("carousel");

    data.forEach((item, i) => {
      const slideEl = document.createElement("div");
      slideEl.className = "slide" + (i === 0 ? " active" : "");

      const img = document.createElement("img");
      img.src = item.src;
      img.alt = item.caption || "";

      const captionEl = document.createElement("div");
      captionEl.className = "caption";
      captionEl.textContent = item.caption || "";

      slideEl.appendChild(img);
      if (item.caption) slideEl.appendChild(captionEl);
      container.appendChild(slideEl);
      slides.push(slideEl);
    });

    startAutoplay();
  }

  function showSlide(index) {
    slides[currentIndex].classList.remove("active");
    currentIndex = (index + slides.length) % slides.length;
    slides[currentIndex].classList.add("active");
  }

  function changeSlide(direction) {
    showSlide(currentIndex + direction);
    restartAutoplay(); // manual click resets the timer
  }

  function startAutoplay() {
    timer = setInterval(() => showSlide(currentIndex + 1), SLIDE_DURATION_MS);
  }

  function restartAutoplay() {
    clearInterval(timer);
    startAutoplay();
  }

  loadCarousel();
</script>

</body>
</html>

<!doctype html>
<html lang="en-US">
    <head>
        <title>Photo Gallery | Owen Maurer Photography</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <meta name="author" content="Owen Maurer" />
        <meta name="description" content="Gallery of Photos Taken by Owen Maurer" />
        <link rel="icon" href="photos/permanent/mini logo.png" type="image/x-icon" />
        <link href="styles/style.css" rel="stylesheet" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <div id="page-wrapper">
        <body>
            <header>
                <img class="logo" src="photos/permanent/flower logo.jpg" alt="Logo of a flower" width = 64px height = 64px/>
                <p class="page-title"><a href="home-page.html">Owen Maurer Photography</a></p>
                <nav>
                    <a href="gallery.html">Gallery</a>
                    <a href="about-me.html">About Me</a>
                    <a href="contact.html">Get in Touch</a>
                    <a href="prints.html">Prints</a>
                </nav>
            </header>
            <hr>

            <a href="gallery.html" id="album-exit" class="underline-link">&#10094; back to gallery</a>
            <div id="album-page-header">
                <div id="album-title"></div>
                <div id="album-date"></div>
            </div>

            <div id="photo-grid" class="photo-grid"></div>
            <div id="overlay" class="overlay">
                <img id="overlay-img" src="" />
                <button id="photo-arrow-prev" class="photo-arrow" onclick="changePhoto(-1)">&#10094;</button>
                <button id="photo-arrow-next" class="photo-arrow" onclick="changePhoto(1)">&#10095;</button>
                <button class="exit" onclick="exit()">&#10006;</button>
            </div>
            <script>
                const params = new URLSearchParams(window.location.search);
                const albumSlug = params.get("album");

                async function loadAlbumInfo() {
                    const ALBUM_JSON = "photos/albums.json";
                    const res = await fetch(ALBUM_JSON);
                    const data = await res.json();
                    const album = data.find(album => album.slug === albumSlug);
                    document.getElementById("album-title").textContent = album.name;
                    document.getElementById("album-date").textContent = album.date;
                }

                const PHOTOS_JSON = "photos/" + albumSlug + "/photos.json"
                let photos = [];
                let currentIndex = 0;
                

                async function loadPhotos() {
                    const photoRes = await fetch(PHOTOS_JSON);
                    const photoData = await photoRes.json();
                    const container = document.getElementById("photo-grid");

                    photoData.forEach((photo, i) => {
                        const currPhoto = document.createElement("div");
                        currPhoto.className = "photo";

                        const img = document.createElement("img");
                        img.src = photo.src;
                        img.addEventListener("click", () => {
                            document.getElementById("overlay").classList.add("active");
                            document.getElementById("overlay-img").src = img.src;
                            currentIndex = i;
                            updateArrows();
                        })

                        currPhoto.appendChild(img);
                        container.appendChild(currPhoto);
                        photos.push(currPhoto);
                    })
                }

                async function changePhoto(direction) {
                    if (direction > 0 && currentIndex < photos.length - 1) {
                        document.getElementById("overlay-img").src = photos[currentIndex + 1].querySelector("img").src;
                        currentIndex += 1;
                    } else if (direction < 0 && currentIndex > 0) {
                        document.getElementById("overlay-img").src = photos[currentIndex - 1].querySelector("img").src;
                        currentIndex -= 1;
                    }
                    updateArrows();
                }

                async function exit() {
                    document.getElementById("overlay").classList.remove("active");
                }

                async function updateArrows() {
                    if (currentIndex === 0) {
                        document.getElementById("photo-arrow-prev").classList.add("hidden");
                    } else {
                        document.getElementById("photo-arrow-prev").classList.remove("hidden");
                    }

                    if (currentIndex === photos.length - 1) {
                        document.getElementById("photo-arrow-next").classList.add("hidden");
                    } else {
                        document.getElementById("photo-arrow-next").classList.remove("hidden");
                    }
                }

                loadAlbumInfo();
                loadPhotos();
            </script>
            
        </body>
    </div>
</html>
